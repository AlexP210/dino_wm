name: push_cube
args: []
kwargs:
  # Where sample_random_init_goal_states (goal_source: 'random_state') draws demonstrated
  # init/goal pairs from — the same recording the world model trains on.
  goal_data_path: ${env.dataset.data_path}

dataset:
  _target_: "datasets.pushcube_dset.load_pushcube_slice_train_val"
  n_rollout: null
  normalize_action: ${normalize_action}
  data_path: ${data_dir}/maniskill/PushCube-v1/videos/trajectory.rgb.pd_ee_delta_pos.physx_cuda.dino.mmap.frac0.7.h5
  split_ratio: 0.8
  transform:
    _target_: "datasets.img_transforms.default_transform"
    img_size: ${img_size}

decoder_path: null
num_workers: 16