name: place_sphere
args: []
kwargs:
  # Where sample_random_init_goal_states (goal_source: 'random_state') draws demonstrated
  # init/goal pairs from — the same recording the world model trains on.
  goal_data_path: ${env.dataset.data_path}

dataset:
  _target_: "datasets.placesphere_dset.load_placesphere_slice_train_val"
  n_rollout: null
  normalize_action: ${normalize_action}
  data_path: ${data_dir}/maniskill/PlaceSphere-v1.1-ppo-visual-wrist-224-pd_ee_delta_pos/demos/trajectory.dino16.mmap.frac1.0.h5
  split_ratio: 0.8
  transform:
    _target_: "datasets.img_transforms.default_transform"
    img_size: ${img_size}

decoder_path: null
num_workers: 16