# Side-by-side rollout of one validation trajectory: the simulator on the top row, the world
# model on the bottom. See rollout.py.
#
# Three choices pick out what gets rolled out:
#   env        -- which conf/env config supplies the gym id and its kwargs
#   dataset    -- which conf/dataset config supplies the validation trajectories
#   ckpt_path  -- which trained world model imagines them
#
# Everything about how the model is *built* (num_hist, num_pred, frameskip, concat_dim, the
# encoder/decoder/predictor specs) is read back from the hydra.yaml frozen beside the
# checkpoint at training time, never from here: rebuilding those from current defaults would
# quietly assemble a different model than the weights were trained for.
defaults:
  - _self_
  - env: push_cube
  - dataset: pushcube
  - override hydra/launcher: basic

hydra:
  run:
    dir: ${output_dir}/dino_rollouts/${now:%Y%m%d-%H%M%S}_${env.name}

# The checkpoint to roll out. Its run directory -- two levels up, alongside checkpoints/ --
# must still hold the hydra.yaml written there at training time.
ckpt_path: /data/AlexPleava/outputs/dino/outputs/2026-08-26/11-19-56_push_cube/checkpoints/model_latest.pth

# Which validation trajectory to replay. null draws one uniformly at random from those long
# enough for the requested horizon, under `seed`.
traj_id: null
# Where in that trajectory the rollout starts, counted in dataset frames. null means frame 0.
start: null
# Rollout length in world-model steps, each covering `frameskip` env steps. null rolls out as
# much of the trajectory as fits from `start` -- i.e. the whole thing.
horizon: null

seed: 0
device: cuda:0

# These belong to the dataset configs above (the image transform and whether actions are
# normalized), but they have to agree with what the checkpoint trained under or the
# normalization statistics and the model stop matching. rollout.py asserts that rather than
# trusting it.
img_size: 224
normalize_action: True

# Config variables to run inside TSD environment
checkpoint_dir: ???
output_dir: ???
data_dir: ???
