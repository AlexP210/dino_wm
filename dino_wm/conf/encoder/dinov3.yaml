_target_: models.dinov3.DinoV3Encoder
name: "dinov3_vits16"
feature_key: "x_norm_patchtokens"

# These MUST be the checkout and weights tools/preprocess_data_mmap.py encoded the
# dataset's dino_patch_features with. encode_obs uses the precomputed features during
# training and this encoder during planning, so a mismatch is invisible until inference.
repo_dir: ${oc.env:PROJECT_ROOT}/dependencies/dinov3
weights: ${oc.env:CHECKPOINT_DIR}/dino/dinov3_vits16_pretrain_lvd1689m-08c60483.pth
