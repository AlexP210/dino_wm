# PushCube-v1 recordings (datasets/pushcube_dset.py).
#
# Deliberately self-contained rather than an alias for ${env.dataset}: naming the dataset
# separately from the env is the point of this config group, and rollout.py checks
# `data_path` against the recording the checkpoint trained on, so a deliberate swap is
# possible and an accidental one is loud.
_target_: "datasets.pushcube_dset.load_pushcube_slice_train_val"
n_rollout: null
normalize_action: ${normalize_action}
data_path: ${data_dir}/maniskill/PushCube-v1.1-ppo-staged-pd_ee_delta_pos/videos/trajectory.rgb.pd_ee_delta_pos.physx_cuda.dino16.mmap.frac1.0.h5
split_ratio: 0.8
transform:
  _target_: "datasets.img_transforms.default_transform"
  img_size: ${img_size}
