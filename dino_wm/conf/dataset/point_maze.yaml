# PointMaze recordings (datasets/point_maze_dset.py). See pushcube.yaml on why these mirror
# the env configs' dataset blocks rather than referencing them.
_target_: "datasets.point_maze_dset.load_point_maze_slice_train_val"
n_rollout: null
normalize_action: ${normalize_action}
data_path: ${oc.env:DATASET_DIR}/point_maze
split_ratio: 0.9
transform:
  _target_: "datasets.img_transforms.default_transform"
  img_size: ${img_size}
